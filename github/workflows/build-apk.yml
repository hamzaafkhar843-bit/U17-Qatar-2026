name: Build U17 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء التطبيق
        run: gradle assembleDebug

      - name: استخراج APK
        uses: actions/upload-artifact@v4
        with:
          name: U17-Qatar-2026-APK
          path: app/build/outputs/apk/debug/*.apk
